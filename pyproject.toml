[project]
name = "grimmealie"
version = "1.3.0"
description = "Import recipes from Grimmory/BookLore ebooks into Mealie via screenshot capture"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.25",
    "Pillow>=10.0",
    "rich>=13.0",
]

[project.scripts]
grimmealie = "grimmealie.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "invoke>=2.0",
    "ty>=0.0.34",
]
