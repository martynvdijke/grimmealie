name: CI checks

on:
  workflow_call:
  push:
    branches-ignore:
          - 'main'
  pull_request:
    branches:
      - "**"
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Ensure lockfile exists
        run: |
          if [ ! -f uv.lock ]; then
            uv lock
          fi

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run invoke all
        run: uv run invoke all

  otel:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@895874bfae14f840e3032f1a14c3f2b45c93f4af # v4.1.1
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.OTEL_TOKEN }}
