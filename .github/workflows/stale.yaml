name: Stale
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9.1.1
        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            had no activity in 60 days. It will be closed in 7 days if no
            further activity occurs.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has
            had no activity in 30 days. It will be closed in 7 days if no
            further activity occurs.
          close-pr-message: >
            This PR has been closed due to inactivity. The associated branch
            will be automatically deleted.
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-close: 7
          delete-branch: true
          exempt-pr-labels: dependabot,renovate,dependencies
          exempt-issue-labels: pinned,security
